- title: Pipeline Tumor-Only para WES
  subtitle: Desenvolvimento de pipeline
  description: >-
    Pipeline para identificação de variantes somáticas em sequenciamento de
    exoma completo (WES) de amostras tumorais sem par normal: controle de
    qualidade, alinhamento, chamada e filtragem de variantes e anotação.
  categories: [Pipeline, WES, Oncologia, Variant calling]
  image: assets/projetos/tumor-only-wes.svg
