project:
  type: website
  output-dir: docs # o GitHub Pages publica a pasta 'docs' (Settings > Pages > branch main /docs)
  # Gera publicacoes.yml a partir de publicacoes.bib antes de cada renderização
  pre-render: python3 scripts/bib2yml.py
  # Arquivos referenciados só em HTML cru (não detectados automaticamente)
  resources:
    - assets/favicon.svg
    - assets/apple-touch-icon.png

lang: pt-BR

website:
  title: "Mateus Falco"
  description: "Cientista Biomédico, doutorando em Ciências Farmacêuticas e fundador da Genobit. Bioinformática, biologia computacional e genômica."
  site-url: https://mateusfalco.github.io
  repo-url: https://github.com/mateusfalco/mateusfalco.github.io
  favicon: assets/favicon-32.png
  image: profile.jpg
  open-graph: true
  twitter-card: true
  navbar:
    # Texto da navbar (o título do site, usado nas abas e no Google, continua "Mateus Falco")
    title: 'Falco<span class="brand-tag"><span class="brand-tag-main">BioData</span><span class="brand-tag-sub">Analyst</span></span>'
    logo: assets/logo.svg
    logo-alt: "Logo: falcão"
    left:
      - href: index.qmd
        text: Início
      - href: projetos.qmd
        text: Projetos
      - href: publicacoes.qmd
        text: Publicações
      - href: comunidade.qmd
        text: Comunidade
      - href: blog.qmd
        text: Blog
    right:
      - href: cv-mateus-falco.pdf
        text: CV
        icon: file-earmark-person
        aria-label: Baixar currículo em PDF
      - href: en/index.qmd
        text: EN
        aria-label: English version
      - icon: github
        href: https://github.com/mateusfalco
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/mateusfalco/
        aria-label: LinkedIn
      - icon: rss
        href: blog.xml
        aria-label: RSS do blog
  page-footer:
    center: |
      Desenvolvido com [Quarto](https://quarto.org). <br>
      <span class="genobit">Powered by GENO<span class="genobit-bit">Bit</span><span class="genobit-dot">.</span></span>

format:
  html:
    theme:
      light: [flatly, theme/light.scss]
      dark: [darkly, theme/dark.scss]
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    # Favicon vetorial (declarado depois do PNG para ter prioridade) e ícone do iOS
    include-in-header:
      text: |
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
        <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
